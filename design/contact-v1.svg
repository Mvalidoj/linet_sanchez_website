<?xml version="1.0" encoding="UTF-8"?>
<!-- LÁMINA DE DISEÑO — /contact (flujo "imagen primero", piloto)
     Blueprint: docs/design/redesign_v2/03 §G · Tokens: 02 (valores literales)
     Frame desktop 1360px, página completa (header + main + colofón footer).
     Marcas de contenido (Regla 7): intro (d) · ciudad (d, por confirmar B8)
     · año © (d). Sin formulario (decisión de diseño 06 §6).
     NO es la página: estática, no responsive, sin interacción. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1160" viewBox="0 0 1360 1160">
  <style>
    @font-face {
      font-family: 'Newsreader';
      font-style: normal;
      font-weight: 200 800;
      font-display: swap;
      src: url('../assets/fonts/Newsreader-var-latin.woff2') format('woff2-variations');
    }
    @font-face {
      font-family: 'Instrument Sans';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url('../assets/fonts/InstrumentSans-var-latin.woff2') format('woff2-variations');
    }
    text { font-kerning: normal; }
    .display { font-family:'Newsreader',Georgia,serif; font-weight:300; letter-spacing:-0.01em; fill:#1D1C1B; }
    .body    { font-family:'Newsreader',Georgia,serif; font-weight:400; fill:#1D1C1B; font-size:20px; }
    .meta    { font-family:'Instrument Sans',Arial,sans-serif; font-weight:450; letter-spacing:0.04em; fill:#77756F; font-size:12.5px; }
    .nav     { font-family:'Instrument Sans',Arial,sans-serif; font-weight:450; letter-spacing:0.04em; fill:#1D1C1B; font-size:13px; }
    .link-line { stroke:#1D1C1B; stroke-width:1; }
  </style>

  <rect width="1360" height="1160" fill="#F3F2F0"/>

  <!-- ===== HEADER (idéntico a todas las páginas, en luz) ===== -->
  <text class="display" x="54" y="58" font-size="33">Linet Sánchez</text>
  <text class="nav" x="1092" y="55">Work</text>
  <text class="nav" x="1142" y="55">About</text>
  <text class="nav" x="1198" y="55">Contact</text>
  <text class="nav" x="1272" y="55">More</text>

  <!-- ===== MAIN: título en rail + escenario ===== -->
  <!-- rail 3/12 (termina ~x353) · escenario 7/12 (x372 – x1095) · vacío 2/12 -->
  <text class="display" x="54" y="312" font-size="52">Contact</text>

  <text class="body" x="372" y="312">For exhibitions, acquisitions, press and professional enquiries:</text>

  <text class="body" x="372" y="366">linetsg@gmail.com</text>
  <line class="link-line" x1="372" y1="373" x2="528" y2="373"/>

  <text class="body" x="372" y="397">@linetsanchezart</text>
  <line class="link-line" x1="372" y1="404" x2="515" y2="404"/>

  <text class="meta" x="372" y="441">Studio:</text>
  <text class="meta" x="372" y="469">Havana, Cuba</text>

  <!-- ===== COLOFÓN (footer = Acto IV, idéntico a la Home) ===== -->
  <text class="meta" x="54" y="661">About</text>
  <text class="body" x="372" y="661">Linet Sánchez builds empty, colorless architectural spaces — houses</text>
  <text class="body" x="372" y="693">remembered, theatres danced, stages never entered — and photographs,</text>
  <text class="body" x="372" y="725">films and exhibits them as sculptural objects.</text>

  <text class="meta" x="372" y="760">Press documentation will be published here.</text>
  <text class="meta" x="372" y="788">Exhibition history is being documented.</text>

  <text class="meta" x="54" y="854">Contact</text>
  <text class="body" x="372" y="854">linetsg@gmail.com</text>
  <line class="link-line" x1="372" y1="861" x2="528" y2="861"/>
  <text class="body" x="372" y="885">@linetsanchezart</text>
  <line class="link-line" x1="372" y1="892" x2="515" y2="892"/>
  <text class="meta" x="372" y="916">Havana, Cuba</text>

  <!-- footer-bottom -->
  <text class="display" x="54" y="1060" font-size="33">Linet Sánchez</text>
  <text class="nav" x="1030" y="1057">Work</text>
  <text class="nav" x="1080" y="1057">About</text>
  <text class="nav" x="1136" y="1057">Contact</text>
  <text class="meta" x="1206" y="1057">&#169; Linet S&#225;nchez</text>
</svg>
